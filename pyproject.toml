# dev-standards' own tooling. It is not a package: bootstrap.py runs from the checkout.

[project]
name = "dev-standards"
version = "0.1.0"
description = "Shared development standards, templates and the bootstrap that applies them."
requires-python = ">=3.12,<3.16"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.8", "interrogate>=1.7", "pip-audit>=2.7", "pip-licenses>=5"]
typecheck = ["pyright>=1.1.390"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typecheck"},
    "pre-commit>=4",
]

# Ruff reads ruff.toml and .ruff.toml ahead of this file, so its settings live in
# .ruff.toml (this repo) and ruff.toml (shared with every repo).

[tool.pyright]
include = ["bootstrap.py", "devstandards", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-private = true
verbose = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["devstandards"]

[tool.coverage.report]
fail_under = 95
show_missing = true
