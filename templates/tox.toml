# Single entry point: `tox` runs tests on every supported Python plus all checks.
# tox-uv's lock runner installs each dependency group from uv.lock, so tox, pre-commit
# and CI use the same tool versions. Run `uv lock` after changing dependencies.
# Add repo-specific environments below; leave ones that need real services (e.g. an
# integration run) out of env_list so a plain `tox` stays self-contained.
requires = ["tox>=4.22", "tox-uv>=1.25"]
env_list = ["3.12", "3.13", "3.14", "3.15", "minimum", "lint", "type", "docstrings", "audit", "licenses"]
skip_missing_interpreters = false

[env_run_base]
runner = "uv-venv-lock-runner"
package = "wheel"  # test the built package, not the source tree
description = "Run tests with coverage"
dependency_groups = ["test"]
# Each environment keeps its own coverage data, so `tox -p` runs do not race on one
# shared .coverage file. tox empties env_tmp_dir at the start of every run.
set_env = { COVERAGE_FILE = "{env_tmp_dir}/.coverage" }
commands = [["pytest", "--cov", "--cov-report=term-missing", { replace = "posargs", extend = true }]]

[env.minimum]
description = "Run tests against the lowest versions pyproject.toml allows"
# Proves the lower bounds are true. uv resolves the package and the test group in a
# single step with every direct requirement at its floor; installing them separately
# would let a test tool pull a newer runtime dependency in first. The lock runner is
# not used, because uv.lock pins the newest versions.
runner = "uv-venv-runner"
base_python = ["3.12"]
skip_install = true
dependency_groups = []  # installed by commands_pre instead
allowlist_externals = ["uv"]
commands_pre = [[
    "uv", "pip", "install", "--python", "{env_python}",
    "--resolution", "lowest-direct", "--group", "test", ".",
]]

[env.lint]
description = "Ruff lint and format check"
dependency_groups = ["lint"]
skip_install = true
commands = [["ruff", "check", "."], ["ruff", "format", "--check", "."]]

[env.type]
description = "Pyright strict type check"
dependency_groups = ["typecheck", "test"]
commands = [["pyright"]]

[env.docstrings]
description = "Docstring coverage"
dependency_groups = ["lint"]
skip_install = true
commands = [["interrogate", "src"]]

[env.audit]
description = "Known-vulnerability audit of dependencies"
dependency_groups = ["lint"]
commands = [["pip-audit"]]

[env.licenses]
description = "Fail on GPL-family dependency licences"
dependency_groups = ["lint"]
commands = [["pip-licenses", "--partial-match", "--fail-on=GPL"]]
