# Sections for your repo's pyproject.toml: bootstrap.py appends any you lack.
# Assumes dev-standards is a git submodule at `.dev-standards` (see README).

[project]
name = "your-package"
version = "0.1.0"
requires-python = ">=3.12,<3.16"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.8", "interrogate>=1.7", "pip-audit>=2.7", "pip-licenses>=5"]
typecheck = ["pyright>=1.1.390"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typecheck"},
    "pre-commit>=4",
]

[tool.ruff]
extend = ".dev-standards/ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Must live in the consuming repo (see the note in ruff.toml).
# Tests use fake paths, secrets and errors as data: S105/S106/S108/TRY003 are noise.
"tests/**" = ["S101", "S105", "S106", "S108", "D", "PLR2004", "ARG", "TRY003"]
"scripts/**" = ["T20", "D"]

# Local overrides go below. Never weaken the shared rules repo-wide.

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.interrogate]
# Run as `interrogate src` (tox and pre-commit do): a bare `interrogate` scans the whole
# repo, including the submodule and any virtual environments.
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-private = true
verbose = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source_pkgs = ["your_package"]  # package name, so installed (src-layout) code is measured

[tool.coverage.report]
fail_under = 95  # a repo may change this; record why in AGENTS.md
show_missing = true
