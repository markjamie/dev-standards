# Hooks run through `uv run`, so tool versions come from uv.lock and always
# match tox. Install with: uv sync && uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: interrogate
        name: interrogate
        entry: uv run interrogate src
        language: system
        types: [python]
        pass_filenames: false
